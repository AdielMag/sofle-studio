<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151821"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="rgbGlow" cx="50%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="kRose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="kPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="knobBody" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Container badge with chamfered rounded edges -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#body)" stroke="url(#border)" stroke-width="1.2"/>
  <rect x="2" y="2" width="28" height="28" rx="6.5" fill="url(#rgbGlow)"/>

  <!-- LEFT SPLIT HALF (columnar stagger) -->
  <g transform="translate(3.4, 5.0)">
    <!-- Col 1: Pinky (lowered) -->
    <rect x="0" y="3.4" width="2.5" height="3.0" rx="0.8" fill="#334155"/>
    <rect x="0" y="7.0" width="2.5" height="3.0" rx="0.8" fill="#334155"/>
    <rect x="0" y="10.6" width="2.5" height="3.0" rx="0.8" fill="#1e293b"/>

    <!-- Col 2: Ring (stepped up) -->
    <rect x="3.1" y="1.6" width="2.5" height="3.0" rx="0.8" fill="#475569"/>
    <rect x="3.1" y="5.2" width="2.5" height="3.0" rx="0.8" fill="url(#kCyan)"/>
    <rect x="3.1" y="8.8" width="2.5" height="3.0" rx="0.8" fill="#334155"/>
    <rect x="3.1" y="12.4" width="2.5" height="3.0" rx="0.8" fill="#1e293b"/>

    <!-- Col 3: Middle (peak) -->
    <rect x="6.2" y="0.6" width="2.5" height="3.0" rx="0.8" fill="#475569"/>
    <rect x="6.2" y="4.2" width="2.5" height="3.0" rx="0.8" fill="#475569"/>
    <rect x="6.2" y="7.8" width="2.5" height="3.0" rx="0.8" fill="#334155"/>
    <rect x="6.2" y="11.4" width="2.5" height="3.0" rx="0.8" fill="#1e293b"/>

    <!-- Thumb cluster arc -->
    <rect x="4.2" y="15.8" width="3.6" height="2.6" rx="0.8" fill="#38bdf8" transform="rotate(-16 4.2 15.8)"/>
  </g>

  <!-- RIGHT SPLIT HALF (mirrored) -->
  <g transform="translate(17.2, 5.0)">
    <!-- Col 3: Middle (peak) -->
    <rect x="0" y="0.6" width="2.5" height="3.0" rx="0.8" fill="#475569"/>
    <rect x="0" y="4.2" width="2.5" height="3.0" rx="0.8" fill="#475569"/>
    <rect x="0" y="7.8" width="2.5" height="3.0" rx="0.8" fill="#334155"/>
    <rect x="0" y="11.4" width="2.5" height="3.0" rx="0.8" fill="#1e293b"/>

    <!-- Col 2: Ring (stepped up) -->
    <rect x="3.1" y="1.6" width="2.5" height="3.0" rx="0.8" fill="#475569"/>
    <rect x="3.1" y="5.2" width="2.5" height="3.0" rx="0.8" fill="url(#kRose)"/>
    <rect x="3.1" y="8.8" width="2.5" height="3.0" rx="0.8" fill="#334155"/>
    <rect x="3.1" y="12.4" width="2.5" height="3.0" rx="0.8" fill="#1e293b"/>

    <!-- Col 1: Pinky (lowered) -->
    <rect x="6.2" y="3.4" width="2.5" height="3.0" rx="0.8" fill="#334155"/>
    <rect x="6.2" y="7.0" width="2.5" height="3.0" rx="0.8" fill="#334155"/>
    <rect x="6.2" y="10.6" width="2.5" height="3.0" rx="0.8" fill="#1e293b"/>

    <!-- Thumb cluster arc -->
    <rect x="0.8" y="16.8" width="3.6" height="2.6" rx="0.8" fill="#fb7185" transform="rotate(16 0.8 16.8)"/>
  </g>

  <!-- Center Rotary Encoder knob with metal knurl texture and jewel indicator -->
  <circle cx="16" cy="19.5" r="3.2" fill="url(#knobBody)" stroke="#475569" stroke-width="0.8"/>
  <circle cx="16" cy="19.5" r="2.2" fill="none" stroke="#64748b" stroke-width="0.5" stroke-dasharray="1 0.8"/>
  <!-- Encoder active LED jewel -->
  <circle cx="16" cy="19.5" r="1.1" fill="url(#kPurple)"/>
  <circle cx="16" cy="19.2" r="0.4" fill="#fff" opacity="0.8"/>
</svg>